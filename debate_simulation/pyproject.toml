[project]
name = "debate-simulation"
version = "0.1.0"
description = "Geração de prompts de persona e simulação de debates políticos improdutivos a partir do MatrAIx Persona 1M"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "openai>=1.0",
    "pydantic>=2.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config", "src/debate", "src/debater", "src/judge", "src/llm", "src/moderator"]
